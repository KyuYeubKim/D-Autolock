plugins { id 'com.android.application' }
def signingFile = rootProject.file('.signing/release.properties')
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
android {
    namespace 'com.dautolock.bridge'
    compileSdk 34
    defaultConfig {
        applicationId 'com.dautolock.bridge'
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName '0.3.1'
    }
    signingConfigs {
        localRelease {
            if (signingFile.exists()) {
                storeFile rootProject.file('.signing/d-autolock.jks')
                storePassword signingProps.getProperty('storePassword')
                keyAlias 'd-autolock'
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes { release { if (signingFile.exists()) signingConfig signingConfigs.localRelease } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    testOptions { unitTests.returnDefaultValues = false; unitTests.includeAndroidResources = true }
}
dependencies {
    implementation project(':vehiclelink')
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
