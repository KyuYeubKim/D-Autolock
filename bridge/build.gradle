plugins { id 'com.android.application' }
def signingFile = rootProject.file('.signing/release.properties')
def signingProps = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
android {
    namespace 'com.dautolock.bridge'
    compileSdk 34
    defaultConfig {
        applicationId 'com.dautolock.bridge'
        minSdk 26
        // Target 30 (not 34) so the head unit can auto-start the foreground service after a reboot:
        // apps targeting 31+ are blocked from starting a foreground service from the background, and
        // 34 further restricts which FGS types may start from BOOT_COMPLETED. The reference LinkLock
        // relay app uses the same low-targetSdk workaround.
        targetSdk 30
        versionCode 7
        versionName '0.3.3'
    }
    signingConfigs {
        localRelease {
            if (signingFile.exists()) {
                storeFile rootProject.file('.signing/d-autolock.jks')
                storePassword signingProps.getProperty('storePassword')
                keyAlias 'd-autolock'
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes { release { if (signingFile.exists()) signingConfig signingConfigs.localRelease } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    testOptions { unitTests.returnDefaultValues = false; unitTests.includeAndroidResources = true }
    // Sideloaded head-unit app (not on Play), intentionally targetSdk 30 so it can auto-start a
    // foreground service after a reboot. The Play-only "target API too old" check does not apply.
    lint { abortOnError true; disable 'ExpiredTargetSdkVersion' }
}
dependencies {
    implementation project(':vehiclelink')
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
